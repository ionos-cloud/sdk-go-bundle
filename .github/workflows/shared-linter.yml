name: Shared Library Linter

on:
  pull_request:
    types: [ assigned, opened, synchronize, reopened ]
    paths:
      - 'shared/**'

jobs:
  detect-noop:
    runs-on: ubuntu-latest
    outputs:
      noop: ${{ steps.noop.outputs.should_skip }}
    steps:
      - name: Detect No-op Changes
        id: noop
        uses: fkirc/skip-duplicate-actions@v5.3.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          paths_ignore: '["**.md", "**.png", "**.jpg","docs/**.md", "examples/**.yaml"]'
          do_not_skip: '["workflow_dispatch", "schedule", "push"]'
          concurrent_skipping: false

  lint:
    runs-on: ubuntu-latest
    needs: detect-noop
    if: needs.detect-noop.outputs.noop != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'shared/go.mod'
          cache-dependency-path: shared/go.sum
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: 'v2.10.1'
          working-directory: shared
          args: --timeout 10m0s --verbose --new-from-rev=origin/${{ github.base_ref }}

  modernizer:
    runs-on: ubuntu-latest
    needs: detect-noop
    if: needs.detect-noop.outputs.noop != 'true'
    # Advisory: shared/ has a pre-existing modernize backlog (much of it in generated files).
    # Drop continue-on-error to make this blocking once the backlog is cleared.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'shared/go.mod'
          cache-dependency-path: shared/go.sum
      - name: Run modernize
        # working-directory + ./... limit the scan to the shared module only.
        working-directory: shared
        run: go run golang.org/x/tools/gopls/internal/analysis/modernize/cmd/modernize@v0.23.0 ./...
